[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Estilo compacto de propósito (várias instruções por linha) e variável `l` para "linha";
# E402: os imports vêm depois de ajustar o ambiente do modo demonstração.
"app.py" = ["E402", "E701", "E702", "E741"]
"notificacoes.py" = ["E701"]
"tests/*.py" = ["E741"]
