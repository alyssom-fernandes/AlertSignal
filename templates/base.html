<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AlertSignal{% endblock %} · AlertSignal</title>
  <meta name="description" content="Controle de vencimento de alvarás, licenças e documentos, com alertas automáticos por e-mail.">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#050505">

  <script>
  /* Tema antes da primeira pintura (sem piscar): a escolha salva vale; sem
     escolha, segue o sistema. */
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.classList.add('js');
    if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f4f6');
  })();

  /* Registro de erros da página: exceções, promessas rejeitadas, console.error,
     recursos que não carregaram e respostas HTTP de erro do fetch.
     Consulte no console com errosRegistrados(). Nada aqui pode lançar erro. */
  (function () {
    var lista = [];
    function registrar(tipo, msg) {
      try { lista.push({ tipo: tipo, msg: String(msg).slice(0, 500), pagina: location.pathname, quando: new Date().toISOString() }); } catch (e) {}
    }
    window.addEventListener('error', function (e) {
      var alvo = e.target;
      if (alvo && alvo !== window && (alvo.src || alvo.href)) registrar('recurso', alvo.src || alvo.href);
      else registrar('erro', (e.message || 'erro') + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason; registrar('promessa', r && r.message ? r.message : r);
    });
    var erroOriginal = console.error;
    console.error = function () {
      try { registrar('console', Array.prototype.map.call(arguments, String).join(' ')); } catch (e) {}
      return erroOriginal.apply(console, arguments);
    };
    if (window.fetch) {
      var fetchOriginal = window.fetch;
      window.fetch = function (recurso, opcoes) {
        var url = recurso && recurso.url ? recurso.url : recurso;
        return fetchOriginal.apply(this, arguments).then(function (resp) {
          if (!resp.ok) registrar('http', resp.status + ' ' + url);
          return resp;
        }, function (err) { registrar('rede', url + ': ' + err); throw err; });
      };
    }
    window.errosRegistrados = function () { return lista.slice(); };
  })();
  </script>

  <link rel="icon" type="image/x-icon"              href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32"   href="{{ url_for('static', filename='favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16"   href="{{ url_for('static', filename='favicon-16x16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180"      href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="manifest"                              href="{{ url_for('static', filename='site.webmanifest') }}">

  <meta property="og:title"       content="AlertSignal">
  <meta property="og:description" content="Controle de vencimento de alvarás e licenças, com alertas automáticos por e-mail.">
  <meta property="og:image"       content="{{ url_for('static', filename='img/og-image.png', _external=True) }}">
  <meta property="og:type"        content="website">
  <meta name="twitter:card"       content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/tabler-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>

<div id="toast" role="status" aria-live="polite"><i class="ti ti-check" aria-hidden="true"></i><span id="toast-msg"></span></div>

{% block content %}{% endblock %}

<dialog class="modal" id="modal-confirmar" aria-labelledby="confirmar-titulo" aria-describedby="confirmar-texto">
  <div class="modal-cab">
    <h2 class="com-icone"><i class="ti ti-alert-triangle txt-danger" id="confirmar-icone" aria-hidden="true" hidden></i><span id="confirmar-titulo">Confirmar</span></h2>
  </div>
  <div class="modal-corpo">
    <p id="confirmar-texto"></p>
  </div>
  <div class="modal-rodape">
    <button type="button" class="btn btn-ghost" data-resposta="nao">Cancelar</button>
    <button type="button" class="btn btn-primary" data-resposta="sim" id="confirmar-sim">Confirmar</button>
  </div>
</dialog>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
